<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Pong</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        
        .game-container {
            text-align: center;
        }
        
        canvas {
            border: 2px solid #fff;
            background-color: #000;
        }
        
        .info {
            margin: 20px 0;
            font-size: 18px;
        }
        
        .controls {
            margin-top: 20px;
            font-size: 14px;
        }
        
        .status {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .score {
            font-size: 24px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="status" id="status">Connecting...</div>
        <div class="score" id="score">Player 1: 0 - Player 2: 0</div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <p>Use W/S keys to move your paddle up/down</p>
            <p>Share this page with a friend to play together!</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
